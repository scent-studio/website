<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scent Studio - Premium luxury perfumes in Pakistan. Discover your signature scent from our curated collection of world-class fragrances." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          var dark = {
            '--lux-cream': '15 15 15',
            '--lux-ivory': '22 22 22',
            '--lux-white': '30 30 30',
            '--lux-warm': '26 24 20',
            '--lux-charcoal': '240 237 232',
            '--lux-ink': '28 28 28',
            '--lux-on-ink': '255 255 255',
            '--lux-steel': '160 158 152',
            '--lux-gold': '205 184 146',
            '--lux-gold-light': '220 204 172',
            '--lux-gold-dark': '184 151 106',
            '--lux-border': '48 46 42',
            '--lux-green': '110 158 108',
            '--lux-red': '210 120 120',
            '--lux-black': '10 10 10',
            '--lux-dark': '38 38 38',
            '--lux-champagne': '240 237 232'
          };
          var light = {
            '--lux-cream': '250 250 247',
            '--lux-ivory': '246 243 238',
            '--lux-white': '255 255 255',
            '--lux-warm': '240 235 227',
            '--lux-charcoal': '28 28 28',
            '--lux-ink': '28 28 28',
            '--lux-on-ink': '255 255 255',
            '--lux-steel': '107 107 107',
            '--lux-gold': '184 151 106',
            '--lux-gold-light': '205 184 146',
            '--lux-gold-dark': '154 123 79',
            '--lux-border': '232 228 220',
            '--lux-green': '79 122 78',
            '--lux-red': '184 92 92',
            '--lux-black': '18 18 18',
            '--lux-dark': '34 34 34',
            '--lux-champagne': '28 28 28'
          };
          var vars = theme === 'dark' ? dark : light;
          for (var key in vars) root.style.setProperty(key, vars[key]);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <title>Scent Studio | Luxury Perfumes Pakistan</title>
  </head>
  <body class="bg-luxury-cream text-luxury-charcoal font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
